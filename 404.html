    <script>
      (() => {
        const root = document.documentElement;
        let savedTheme = null;
        let savedMotion = null;

        root.classList.replace("no-js", "js");

        try {
          savedTheme = localStorage.getItem("olga-theme");
          savedMotion = localStorage.getItem("olga-motion");
        } catch (error) {
          savedTheme = null;
          savedMotion = null;
        }

        const themeMode = ["system", "light", "dark"].includes(savedTheme) ? savedTheme : "system";
        const theme =
          themeMode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : themeMode;
        const motionMode = savedMotion === "reduced" ? "reduced" : "system";
        const motion =
          motionMode === "reduced" || window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "reduced" : "full";

        root.dataset.themeMode = themeMode;
        root.dataset.theme = theme;
        root.dataset.motionMode = motionMode;
        root.dataset.motion = motion;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#11130f" : "#f2efe7";
      })();
    </script>
